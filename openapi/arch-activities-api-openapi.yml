    TaxDocRef:
      type: object
      required:
      - id
      - url
      properties:
        id:
          type: integer
          description: The ID of the referenced tax document
          example: 42
        url:
          type: string
          description: A relative url to the referenced tax document
          example: /tax-documents/42
    CashFlowType:
      description: The type of cash flow
      type: string
      enum:
