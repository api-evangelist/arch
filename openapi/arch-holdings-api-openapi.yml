  /client-api/v0/holdings/{holdingId}/files/types:
    get:
      operationId: get-list-holding-file-types
      summary: Get uploadable file types for a holding
      parameters:
      - name: holdingId
        in: path
        description: The holding to view file types for
        required: true
        schema:
          type: integer
      security:
      - BearerAuth: []
      description: List valid file types for upload
      tags:
      - Holdings
      responses:
        '200':
          description: A list of valid file types.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/FileTypeList'
                - example:
                    kind: FileTypeList
                    contents:
                    - name: Tax Document
                      context: investment
                    - name: Subscription Document
                      context: investment
                    - name: Wire Instructions
                      context: investment
        '404':
          description: Holding ID not found or is inaccessible to the user
          content:
            application/text:
              schema:
                type: string
                example: Not found or inaccessible
  /client-api/v0/holdings/{id}/files:
    get:
      summary: Get all files for a specific holding
      security:
      - BearerAuth: []
      description: Returns a list of file metadata, including a presigned download link for a specific holding, if the user has access through through the access token.
      tags:
      - Holdings
      parameters:
      - name: id
        in: path
        description: A specific holding to query
        required: true
        schema:
          type: integer
      - name: beforeUploadTime
        in: query
        description: Filter the output for files uploaded before the queried time.
        example: '2024-05-22T21:15:55.306Z'
        required: false
        schema:
          type: string
          format: date-time
      - name: afterUploadTime
        in: query
        description: Filter the output for files uploaded after the queried time.
        example: '2024-05-22T21:15:55.306Z'
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: A list of file metadata for the holding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingFileList'
        '404':
          description: Holding id not found or is inaccessible to the user
          content:
            application/text:
              schema:
                type: string
                example: Not found or inaccessible
    post:
      operationId: post-holding-single-file-upload
      summary: Upload a new file
      description: Upload a file and attach it to a holding in Arch. This endpoint is for generic files.
      parameters:
      - name: id
        in: path
        description: The holding to upload to
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - fileType
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload.
                fileType:
                  type: string
                  description: The type of file being uploaded (required). Only accepts files other than statements or cash flows, such as "Agreement", "Fund Correspondence", "Limited Partnership Agreement", "Offering Materials (e.g., PPM, Pitch Deck)", "Subscription Document", or "Miscellaneous Document". For Statements (account statements, quarterly reports, etc.) and Cash Flows (capital call and distribution notices), please use the corresponding endpoints.
                notes:
                  type: string
                  description: Optional notes or comments about the file upload.
      security:
      - BearerAuth: []
      tags:
      - Holdings
      responses:
        '200':
          description: The metadata for the uploaded file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingFileList'
        '404':
          description: Holding id not found or is inaccessible to the user.
          content:
            application/text:
              schema:
                type: string
                example: Not Found or inaccessible
  /client-api/v0/holdings/{id}/files/statements:
    post:
      operationId: post-holding-statement-upload
      summary: Upload a statement file
      description: Upload a statement, report, or letter and attach it to a holding in Arch.
      parameters:
      - name: id
        in: path
        description: The holding to upload to
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - fileType
              - statementDate
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload.
                fileType:
                  type: string
                  enum:
                  - Account Statement
                  - Quarterly Report
                  - Financial Statements
                  description: 'The specific type of statement being uploaded. Must be one of: "Account Statement", "Quarterly Report", "Financial Statements".'
                statementDate:
                  type: string
                  format: date
                  description: The statement date of the document (YYYY-MM-DD).
                notes:
                  type: string
                  description: Optional notes or comments about the file upload.
                financials:
                  type: string
                  description: 'Financial values to update for the holding as a JSON string. Only applies when fileType is "Account Statement". All monetary values should be provided as dollars in USD.

                    Supported fields:

                    - value (Total value of the holding)

                    - totalCommitment (Amount investor promised to contribute to the fund)

                    - totalContribution (Total contributions made towards the commitment)

                    - remainingCommitment (Total contributions required to meet the commitment)

                    - totalDistribution (The amount paid by the fund to the investor)

                    - recallableDistribution (Total distributions that can be recalled)


                    Example: {"value": 100000, "totalContribution": 50000, "totalDistribution": 10000}'
      security:
      - BearerAuth: []
      tags:
      - Holdings
      responses:
        '200':
          description: The metadata for the uploaded file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingFileList'
        '404':
          description: Holding id not found or is inaccessible to the user.
          content:
            application/text:
              schema:
                type: string
                example: Not Found or inaccessible
  /client-api/v0/holdings/{id}/files/cash-flows:
    post:
      operationId: post-holding-cashflow-upload
      summary: Upload a cash flow notice
      description: Upload a capital call or distribution notice and attach it to a holding in Arch.
      parameters:
      - name: id
        in: path
        description: The holding to upload to
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - fileType
              - dueDate
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload.
                fileType:
                  type: string
                  enum:
                  - Capital Call
                  - Distribution
                  description: 'The specific type of cash flow notice being uploaded. Must be one of: "Capital Call", "Distribution".'
                dueDate:
                  type: string
                  format: date
                  description: The due date for action (YYYY-MM-DD).
                cashFlowAmount:
                  type: number
                  description: The cash flow amount in USD.
                notes:
                  type: string
                  description: Optional notes or comments about the file upload.
      security:
      - BearerAuth: []
      tags:
      - Holdings
      responses:
        '200':
          description: The metadata for the uploaded file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingFileList'
        '404':
          description: Holding id not found or is inaccessible to the user.
          content:
            application/text:
              schema:
                type: string
                example: Not Found or inaccessible
  /client-api/v0/holdings/{holdingId}/files/{fileId}/download:
    get:
      summary: Download the file, as originally received.
      security:
      - BearerAuth: []
      description: Download the file, as originally received by Arch.
      tags:
      - Holdings
      parameters:
      - name: holdingId
        in: path
        description: The holding the file exists under
        required: true
        schema:
          type: integer
      - name: fileId
        in: path
        description: The id of the file that's being requested
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: Buffer containing the content of the requested file.
        '404':
          content:
            text/plain:
              schema:
                type: string
          description: Holding id not found or is inaccessible to the user
components:
  schemas:
    ShareTypeEnum:
      type: string
      enum:
      - Class A (Common)
      - Class B (Preferred)
      example: Class A (Common)
    FinancialValue:
      type: object
      properties:
        quantity:
          type: integer
          format: int64
          description: The quantity of the financial value
          example: 100000
        currencyCode:
          $ref: '#/components/schemas/CurrencyCode'
        dollars:
          type: integer
          format: int64
          description: The financial value in dollars
      example:
        quantity: 100000
        currencyCode: USD
        dollars: 100000
    LinkingMethodEnum:
      type: string
      description: 'Method for linking the investment:

        - `LOA` - Arch will link the investment via Letter of Authorization

        - `SubDocs` - Client will provide subdocuments for linking

        - `Do Not Link` - Linking is unavailable for this investment

        '
      enum:
      - LOA
      - SubDocs
      - Do Not Link
      example: LOA
    CustomField:
      type: object
      description: A user-specified custom field. Does not yet support File fields.
      properties:
        name:
          type: string
        fieldType:
          type: string
          enum:
          - TEXT
          - SELECT
          - NUMBER
          - CHECKBOX
          - DATE
          - FILES
          - FINANCIAL_VALUE
        value:
          oneOf:
          - type: string
          - type: number
          - type: boolean
          - $ref: '#/components/schemas/FinancialValue'
    FileTypeList:
      type: object
      properties:
        kind:
          type: string
          enum:
          - FileTypeList
        contents:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Name of the file type for upload
              kind:
                type: string
                description: Kind of data that the file type can be uploaded to
                enum:
                - holding
                - investing-entity
    InvestingEntityRef:
      type: object
      required:
      - kind
      - id
      - url
      properties:
        kind:
          type: string
          enum:
          - investing-entity-ref
        id:
          type: number
          description: The ID of the referenced investing entity
          example: 711
        url:
