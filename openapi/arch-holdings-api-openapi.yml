    TransferInfoInput:
      type: object
      description: 'Records that this new holding is the result of a transfer from an existing holding. The new holding''s start date is set to transferDate and a transfer relationship (transferor holding -> new holding) is recorded.

        '
      required:
      - transferorHoldingId
      - transferDate
      properties:
        transferorHoldingId:
          type: integer
          minimum: 1
          description: The Arch ID of the existing holding this holding was transferred from
          example: 50050
        transferDate:
          type: string
          format: date
          description: The date the transfer took place (YYYY-MM-DD)
          example: '2024-06-30'
        transferType:
          type: string
          enum:
          - partial
          - full
          default: full
          description: 'Whether the transfer is partial or full. Defaults to "full". A full transfer

            ends the transferor holding on transferDate (unless it already has an end date);

            a partial transfer leaves the transferor holding unchanged.

            '
      additionalProperties: false
