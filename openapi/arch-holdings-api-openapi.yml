    NewHolding:
      type: object
      required:
      - investingEntityId
      - offeringId
      properties:
        name:
          type: string
          description: The name for the holding
        investingEntityId:
          type: number
          description: The ID for the entity that owns the holding
        offeringId:
          type: number
          description: The ID for the vehicle that was invested in
        startDate:
          type: string
          format: date
          description: The date the holding began (YYYY-MM-DD)
        endDate:
          type: string
          format: date
          description: The date the holding ends (YYYY-MM-DD)
        financials:
          type: object
          description: Current financial values for the holding. Note - valueAsOfDate is required if any financial values are provided.
          properties:
            valueAsOfDate:
              type: string
              format: date
              description: The timestamp of the most recent valuation. Required if any financial values are provided.
            capitalAccount:
              $ref: '#/components/schemas/NewFinancialValue'
              description: Total value of the holding, in dollars
            initialCommitment:
              $ref: '#/components/schemas/NewFinancialValue'
              description: Total commitment to the holding, in dollars
            totalContribution:
              allOf:
              - $ref: '#/components/schemas/NewFinancialValue'
              - type: object
                properties:
                  quantity:
                    minimum: 0
                description: Total of any contributions made towards the commitment, in dollars. Must be non-negative.
            outstandingCommitment:
              $ref: '#/components/schemas/NewFinancialValue'
              description: Total contributions required to meet the commitment, in dollars
            totalDistributions:
              $ref: '#/components/schemas/NewFinancialValue'
              description: Total of any distributions made from the holding, in dollars
            recallableDistributions:
              $ref: '#/components/schemas/NewFinancialValue'
              description: Total of any distributions made from the holding that can be recalled, in dollars
        customFields:
          type: object
          description: Custom field values for the holding. Map from field definition ID to field value.
          additionalProperties:
            type: object
            required:
            - value
            properties:
              value:
                oneOf:
                - type: string
                - type: number
                - type: boolean
                description: The value for the custom field. Type must match the field definition type. FILES and FINANCIAL_VALUE types are not supported.
      example:
        name: Arch Example Holding
        investingEntityId: 56
        offeringId: 112
        startDate: '2022-03-10'
        endDate: '2024-03-09'
        financials:
          capitalAccount:
            quantity: 100000
          valueAsOfDate: '2023-01-19'
        customFields:
          '707':
            value: Crypto
          '709':
            value: 123.45
