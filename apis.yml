aid: arch
name: Arch
description: >-
  Arch (Arch Labs, Inc.) is the digital administration platform for private
  markets and alternative investments. It aggregates statements, capital calls,
  tax documents, and data from hundreds of funds and sources into one secure
  portal, then uses automation and AI to extract data, summarize documents,
  surface insights, and coordinate workflows for limited partners, advisors,
  accountants, family offices, and fund service providers. The Arch Client API
  is a JSON HTTP REST API that lets customers programmatically access holdings,
  cash flows, investing/issuing entities, activities, tasks, files, and tax
  documents on the platform, authenticating with client-credential JWT bearer
  tokens. Founded in 2018, Arch is backed by Oak HC/FT, Menlo Ventures, Craft
  Ventures, Uncork Capital, Citi Ventures, and others.
